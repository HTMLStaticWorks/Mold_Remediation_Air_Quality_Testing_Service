<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="background:#070B14; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="neg-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="50%" stop-color="#050A14"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>

    <!-- Scrubber Machine Metal Finish -->
    <linearGradient id="scrubber-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Filter Chamber Gradient -->
    <linearGradient id="hepa-filter-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Airflow Stream Gradient -->
    <linearGradient id="air-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#neg-bg-grad)"/>

  <!-- Technical Grid Overlay -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.35">
    <path d="M 0 75 L 900 75 M 0 150 L 900 150 M 0 225 L 900 225 M 0 300 L 900 300 M 0 375 L 900 375 M 0 450 L 900 450 M 0 525 L 900 525"/>
    <path d="M 100 0 L 100 600 M 200 0 L 200 600 M 300 0 L 300 600 M 400 0 L 400 600 M 500 0 L 500 600 M 600 0 L 600 600 M 700 0 L 700 600 M 800 0 L 800 600"/>
  </g>

  <!-- CONTAINMENT AIRLOCK ZONE (LEFT SIDE) -->
  <g transform="translate(40, 100)">
    <!-- 6-Mil Polyethylene Airlock Wall -->
    <rect x="0" y="0" width="220" height="400" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="10" y="10" width="200" height="380" rx="8" fill="rgba(14, 165, 233, 0.05)"/>
    
    <!-- Zipper Decon Door -->
    <line x1="110" y1="20" x2="110" y2="380" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8,6"/>
    <rect x="98" y="180" width="24" height="40" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="204" font-size="10" font-weight="800" fill="#F59E0B" text-anchor="middle">ZIP</text>

    <!-- Zone Label -->
    <rect x="20" y="25" width="180" height="28" rx="14" fill="#030712" stroke="#38BDF8" stroke-width="1"/>
    <text x="110" y="43" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ISOLATION AIRLOCK (6-MIL POLY)</text>

    <!-- Active Contaminated Spores Particle Nodes inside Containment -->
    <g fill="#EF4444" opacity="0.85">
      <circle cx="40" cy="120" r="3.5"/><circle cx="70" cy="180" r="2.5"/><circle cx="150" cy="130" r="4"/>
      <circle cx="170" cy="220" r="3"/><circle cx="50" cy="280" r="4.5"/><circle cx="130" cy="310" r="2.5"/>
      <circle cx="80" cy="340" r="3.5"/><circle cx="160" cy="360" r="3"/>
    </g>
  </g>

  <!-- AIRFLOW VECTOR INTAKE ARROWS (Contaminated Air pulled towards scrubber) -->
  <g fill="none" stroke="url(#air-stream)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12,8">
    <path d="M 180 260 C 240 260, 280 260, 360 260"/>
    <path d="M 180 210 C 250 220, 290 250, 360 260"/>
    <path d="M 180 310 C 250 300, 290 270, 360 260"/>
  </g>

  <!-- HEPA-500 SCRUBBER MACHINE (CENTER - 360, 160) -->
  <g transform="translate(360, 150)">
    <!-- Scrubber Machine Outer Chassis -->
    <rect x="0" y="0" width="280" height="260" rx="16" fill="url(#scrubber-body)" stroke="#10B981" stroke-width="2.5" filter="url(#emerald-glow)"/>
    
    <!-- Heavy Duty Metal Reinforced Corners -->
    <rect x="-4" y="-4" width="24" height="24" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="260" y="-4" width="24" height="24" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="-4" y="240" width="24" height="24" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="260" y="240" width="24" height="24" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <!-- Intake Air Duct Collar (Left Inlet) -->
    <rect x="-24" y="80" width="24" height="100" rx="6" fill="#020617" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="-12" cy="130" r="32" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Multi-Stage Filtration Visual Chamber inside Scrubber -->
    <!-- Stage 1: Pre-Filter Mesh -->
    <rect x="35" y="45" width="20" height="170" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="35" y1="45" x2="55" y2="215" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="45" y="32" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">STAGE 1</text>

    <!-- Stage 2: Activated Carbon Matrix -->
    <rect x="80" y="45" width="30" height="170" fill="#0B132B" stroke="#06B6D4" stroke-width="1.5"/>
    <pattern id="carbon-dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#06B6D4"/>
    </pattern>
    <rect x="82" y="47" width="26" height="166" fill="url(#carbon-dots)"/>
    <text x="95" y="32" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">CARBON</text>

    <!-- Stage 3: True HEPA H13 Filter (99.97%) -->
    <rect x="140" y="45" width="40" height="170" fill="url(#hepa-filter-grad)" stroke="#10B981" stroke-width="2"/>
    <!-- HEPA Pleat V-lines -->
    <path d="M 140 50 L 180 60 L 140 70 L 180 80 L 140 90 L 180 100 L 140 110 L 180 120 L 140 130 L 180 140 L 140 150 L 180 160 L 140 170 L 180 180 L 140 190 L 180 200 L 140 210" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <text x="160" y="32" font-size="8" font-weight="800" fill="#34D399" text-anchor="middle">H13 HEPA</text>

    <!-- Heavy Blower Motor Blower Fan (Right Outlet Side) -->
    <circle cx="230" cy="130" r="34" fill="#020617" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(230, 130)">
      <path d="M -24 0 L 24 0 M 0 -24 L 0 24 M -17 -17 L 17 17 M -17 17 L 17 -17" stroke="#10B981" stroke-width="2.5"/>
      <circle r="10" fill="#10B981"/>
    </g>

    <!-- Machine Digital Control Panel (Top Right Header) -->
    <rect x="70" y="-20" width="140" height="32" rx="6" fill="#030712" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="85" cy="-4" r="4" fill="#10B981"/>
    <text x="96" y="0" font-size="10" font-weight="800" fill="#FFFFFF">500 CFM RUNNING</text>
  </g>

  <!-- PURIFIED EXHAUST AIR DUCT VENTING OUTDOORS (RIGHT SIDE) -->
  <g fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-dasharray="10,6" filter="url(#cyan-glow)">
    <path d="M 640 280 C 700 280, 740 280, 840 280"/>
  </g>
  
  <!-- Clean Air Sparkle Particles (Right Side) -->
  <g fill="#34D399" opacity="0.9">
    <circle cx="720" cy="240" r="3"/><circle cx="780" cy="260" r="4"/><circle cx="830" cy="230" r="2.5"/>
    <circle cx="750" cy="310" r="3.5"/><circle cx="810" cy="300" r="4"/><circle cx="850" cy="330" r="3"/>
  </g>

  <!-- Outflow Exhaust Hood (840, 230) -->
  <g transform="translate(820, 220)">
    <path d="M 0 0 L 40 -20 L 40 140 L 0 120 Z" fill="#0B1E2B" stroke="#10B981" stroke-width="2"/>
    <text x="20" y="-30" font-size="9" font-weight="800" fill="#10B981" text-anchor="middle">OUTDOOR EXHAUST</text>
  </g>

  <!-- TELEMETRY HUD DATA BAR (BOTTOM) -->
  <g transform="translate(100, 480)">
    <rect width="700" height="75" rx="14" fill="#091422" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Metric 1: Pressure Differential -->
    <g transform="translate(30, 20)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">PRESSURE DIFFERENTIAL</text>
      <text x="0" y="38" font-size="18" font-weight="800" fill="#38BDF8">-0.02" W.G. (Contained)</text>
    </g>

    <line x1="250" y1="15" x2="250" y2="60" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Metric 2: Capture Efficiency -->
    <g transform="translate(280, 20)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">HEPA CAPTURE EFFICIENCY</text>
      <text x="0" y="38" font-size="18" font-weight="800" fill="#10B981">99.97% @ 0.3 Microns</text>
    </g>

    <line x1="500" y1="15" x2="500" y2="60" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Metric 3: Air Changes Per Hour -->
    <g transform="translate(530, 20)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">AIR EXCHANGE RATE</text>
      <text x="0" y="38" font-size="18" font-weight="800" fill="#F59E0B">12 ACH Continuous</text>
    </g>
  </g>
</svg>
